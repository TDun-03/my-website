<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN</title>
     <link rel="stylesheet" href="admin.css">
</head>

<body>
    <header>
        <div class="logo">TRUYỆN GÌ CŨNG CÓ</div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li>Fantasy</li>
                <li>Ngôn Tình</li>
                <li>Kinh Dị</li>
                <li>Anime</li>
            </ul>
        </nav>
    </header>
    <div class="editor">
        <h1>Chỉnh Sửa Truyện</h1>
        <div class="form-group"> 
            <label>Tên truyện</label> 
            <input type="text" placeholder="Nhập tên truyện"> 
        </div>
        <div class="form-group"> 
            <label>Thể loại</label> 
            <select>
                <option>Fantasy</option>
                <option>Hành Động</option>
                <option>Ngôn Tình</option>
                <option>Kinh Dị</option>
                <option>Anime</option>
            </select> 
        </div>
        <div class="form-group"> <label>Ảnh bìa</label> 
            <input type="file" id="coverInput" accept="image/*"> 
        </div>
        <div class="preview"> 
            <img id="previewImage"> 
        </div>
        <div class="form-group"> 
            <label>Mô tả truyện</label> 
            <textarea placeholder="Viết mô tả truyện..."></textarea>
        </div>
        <class class="up">
            <p>Đăng</p>
        </class>
    <footer> ©2026 Web Truyện | Thiết kế by tdun </footer>
</body>

</html>
